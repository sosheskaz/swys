# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: swys

before:
  hooks:
    - go mod tidy
    - bash .config/mise/tasks/build/notices
    - >-
      sh -c 'mkdir -p .artifacts/completions &&
      go run . completion bash > .artifacts/completions/swys.bash &&
      go run . completion zsh > .artifacts/completions/swys.zsh &&
      go run . completion fish > .artifacts/completions/swys.fish'

builds:
  - binary: swys
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # CommitDate/CommitTimestamp (not build time) keep builds reproducible.
    ldflags:
      - -s -w
      - -X github.com/sosheskaz/swys/internal/version.version={{ .Version }}
      - -X github.com/sosheskaz/swys/internal/version.commit={{ .FullCommit }}
      - -X github.com/sosheskaz/swys/internal/version.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - LICENSING.md
      - THIRD_PARTY_NOTICES.txt
      - README.md
      - CHANGELOG*
      - skills/swys/SKILL.md
      - src: licenses/oci/*
        dst: licenses/oci
      - src: .artifacts/completions/*
        dst: completions
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  prerelease: auto
  preflight:
    fail_on_error: true

# Multi-arch OCI images to GHCR, built by ko through goreleaser.
# Disabled for snapshot builds so PR validation never pushes.
# Refresh licenses/oci and the base-derived notices when updating this digest.
kos:
  - base_image: cgr.dev/chainguard/static@sha256:fe55470f22d3259488d9d3739168d8f04da67755f0b69382bc26eda4a7d3d327
    repositories:
      - ghcr.io/sosheskaz/swys
    disable: "{{ .IsSnapshot }}"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.source: https://github.com/sosheskaz/swys
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    bare: true
    preserve_import_paths: false
    sbom: spdx
    platforms:
      - linux/amd64
      - linux/arm64

homebrew_casks:
  - name: swys
    binaries: [swys]
    homepage: https://github.com/sosheskaz/swys
    description: "Sysadmin's Swiss Army knife"
    repository:
      owner: sosheskaz
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    # Publish stable releases; leave prereleases out of the tap.
    skip_upload: auto
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/swys"]
          end
    completions:
      bash: completions/swys.bash
      zsh: completions/swys.zsh
      fish: completions/swys.fish
