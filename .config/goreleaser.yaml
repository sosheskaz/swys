# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: swys

before:
  hooks:
    - go mod tidy
    - bash .config/mise/tasks/build/notices

builds:
  - binary: swys
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # CommitDate/CommitTimestamp (not build time) keep builds reproducible.
    ldflags:
      - -s -w
      - -X github.com/sosheskaz/swys/internal/version.version={{ .Version }}
      - -X github.com/sosheskaz/swys/internal/version.commit={{ .FullCommit }}
      - -X github.com/sosheskaz/swys/internal/version.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - LICENSING.md
      - THIRD_PARTY_NOTICES.txt
      - README.md
      - CHANGELOG*
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# Multi-arch OCI images to GHCR, built by ko through goreleaser.
# Disabled for snapshot builds so PR validation never pushes.
kos:
  - repositories:
      - ghcr.io/sosheskaz/swys
    disable: "{{ .IsSnapshot }}"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    bare: true
    preserve_import_paths: false
    sbom: spdx
    platforms:
      - linux/amd64
      - linux/arm64

# No Homebrew cask while the repository is private; add one (see
# sosheskaz/healthchecksio-cli) at public launch.
