# Tool and task definitions for npc. CI installs these same pins via
# jdx/mise-action, so local and CI toolchains cannot drift.
# Tasks live in .config/mise/tasks/ as standalone scripts; run `mise tasks` to list.
[tools]
go = "1.27.1"
gh = "2.100.0"
node = "24.20.0"
"npm:prettier" = "3.9.6"
"npm:release-please" = "17.11.2"
jq = "1.8.2"
golangci-lint = "2.14.0"
goreleaser = "2.18.2"
ko = "0.19.1"
lefthook = "2.1.14"
shfmt = "3.14.1"
taplo = "0.10.0"
uv = "0.12.20"
yamllint = "1.38.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
zizmor = "1.30.1"

[env]
CGO_ENABLED = "0"
# The mise-pinned Go IS the toolchain: forbid go from silently downloading a
# different version to satisfy go.mod toolchain directives. A mismatch should
# fail loudly and be fixed by bumping the pin.
GOTOOLCHAIN = "local"

# Bare verbs imply "all"; nouns narrow the scope (bench:cpu, test:race, ...).
# bench lives inline because a file task named bench cannot coexist with the
# bench/ directory that namespaces its cpu/mem variants.
[tasks.bench]
description = "Run selected benchmarks with allocation reporting"
usage = '''
flag "--package <pattern>" help="Go package pattern" default="./..."
flag "--bench <regexp>" help="Go benchmark regexp, including subbenchmarks" default="."
flag "--benchtime <budget>" help="Duration or iterations per benchmark" default="1s"
flag "--count <count>" help="Repeat each benchmark" default="1"
flag "--package-workers <count>" help="Go package/build concurrency; unset uses Go's default" env="NPC_TEST_PACKAGE_WORKERS"
flag "--list" help="List top-level benchmarks in selected packages without running them"
'''
run = "bash .config/mise/lib/bench.sh run"

[tasks.check]
description = "Run all local validation (lint + test)"
depends = [
  "lint:go",
  "lint:platforms",
  "test:coverage-report",
  "test:coverage-publisher",
  "test:tasks",
  "test:unit",
]

[tasks."test:interop:openpgp"]
description = "Run manual OpenPGP interoperability checks"
depends = ["build:dev"]
run = "tests/interop/openpgp/manual.sh ./npc"

[tasks."clean:artifacts"]
description = "Remove build artifacts and coverage/profile output"
run = "rm -f npc cryptool *.prof *.test coverage.out coverage-base.out && rm -rf .artifacts/bench"

[tasks."install:hooks"]
description = "Install git hooks via lefthook"
run = "lefthook install"

[tasks."test:coverage-publisher"]
description = "Test trusted coverage publication with local API fixtures"
run = "node .github/tests/coverage-comment.test.cjs"
