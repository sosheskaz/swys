name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log verbosity (repository uses RENOVATE_LOG_LEVEL, then info)
        type: choice
        options: [repository, info, debug]
        default: repository

permissions:
  contents: read

jobs:
  renovate:
    uses: sosheskaz-systems/reno/.github/workflows/renovate.yml@d2fa3e8bdb084a57d0c79b77f7d269dd226204e1 # v1.2.1
    with:
      install-go: true
      log-level: ${{ inputs.log_level != 'repository' && inputs.log_level || vars.RENOVATE_LOG_LEVEL || 'info' }}
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
