name: Renovate

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: renovate-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    if: github.ref == 'refs/heads/main' && vars.RENOVATE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Pull pinned distribution
        run: |
          image=$(awk '$1 == "FROM" { print $2 }' .github/renovate.Dockerfile)
          docker pull "$image"

      - name: Create repository token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: write
          permission-vulnerability-alerts: read

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_REPOSITORY: ${{ github.repository }}
        run: |
          image=$(awk '$1 == "FROM" { print $2 }' .github/renovate.Dockerfile)
          docker run --rm --env RENOVATE_TOKEN \
            --env RENOVATE_PLATFORM=github --env RENOVATE_ONBOARDING=false \
            --env RENOVATE_REQUIRE_CONFIG=required --env RENOVATE_DOCKER_MAX_PAGES=10 \
            --env 'RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS=[]' \
            "$image" renovate "$RENOVATE_REPOSITORY"
