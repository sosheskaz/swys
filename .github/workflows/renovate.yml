name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log verbosity (repository uses RENOVATE_LOG_LEVEL, then info)
        type: choice
        options: [repository, info, debug]
        default: repository

permissions:
  contents: read

jobs:
  renovate:
    uses: sosheskaz-systems/reno/.github/workflows/renovate.yml@74a1469c4712351f95ac039a9e214200da2bfa81 # v1.4.0
    with:
      install-go: true
      log-level: ${{ inputs.log_level != 'repository' && inputs.log_level || vars.RENOVATE_LOG_LEVEL || 'info' }}
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
