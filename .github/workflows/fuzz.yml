name: Fuzz

on:
  # Smoke-runs the campaign's plumbing when the workflow or fuzz task changes.
  pull_request:
    paths:
      - .github/workflows/fuzz.yml
      - .config/mise/tasks/test/fuzz
      - .config/mise/lib/go-test.sh
  schedule:
    - cron: '23 6 * * 6'
  workflow_dispatch:
    inputs:
      target:
        description: 'Exact fuzz target name (default: all targets)'
        type: string
        required: false
      fuzztime:
        description: 'Budget per target, overriding the 30s explore preset (for example 5m or 100000x)'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CGO_ENABLED: '0'
  MISE_EXEC_AUTO_INSTALL: 'false'
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

jobs:
  list:
    name: List fuzz packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Register problem matcher
        run: echo "::add-matcher::.github/problem-matchers/go.json"

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.6
          install_args: 'go jq'
          cache: true
          cache_save: false

      - name: Download modules
        run: go mod download

      - name: List packages with fuzz targets
        id: list
        env:
          TARGET: ${{ inputs.target }}
        run: |
          args=(--list)
          if [[ -n "$TARGET" ]]; then
            args+=(--target "$TARGET")
          fi
          listing="$(mise run test:fuzz -- "${args[@]}")"
          # Artifact names reject slashes.
          packages="$(jq -Rnc '[inputs | split("\t")[0]] | unique
            | map({package: ., name: (sub("^github.com/sosheskaz/swys/"; "") | gsub("[^A-Za-z0-9]"; "-"))})' <<<"$listing")"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.name }}
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Register problem matcher
        run: echo "::add-matcher::.github/problem-matchers/go.json"

      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.6
          install_args: 'go jq'
          cache: true
          cache_save: false

      - name: Download modules
        run: go mod download

      - name: Fuzz campaign
        env:
          PACKAGE: ${{ matrix.package }}
          PRESET: ${{ github.event_name == 'pull_request' && 'smoke' || 'explore' }}
          TARGET: ${{ inputs.target }}
          FUZZTIME: ${{ inputs.fuzztime }}
        run: |
          args=(--package "$PACKAGE" --preset "$PRESET")
          if [[ -n "$TARGET" ]]; then
            args+=(--target "$TARGET")
          fi
          if [[ -n "$FUZZTIME" ]]; then
            args+=(--fuzztime "$FUZZTIME")
          fi
          mise run test:fuzz -- "${args[@]}"

      - name: Collect failing inputs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-failures"
          git ls-files -z --others --exclude-standard -- '*/testdata/fuzz/*' |
            xargs -0 -r cp --parents -t "$RUNNER_TEMP/fuzz-failures"

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ matrix.name }}
          path: ${{ runner.temp }}/fuzz-failures
          if-no-files-found: ignore
