name: GoReleaser

# Path-filtered: NOT suitable as a required branch-protection check (a PR
# that doesn't touch these paths would leave the check pending forever).
# ci.yml and lefthook.yml are the always-run candidates for required checks.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - .goreleaser.yaml
      - mise.toml
      - .github/workflows/goreleaser.yml
      - .github/workflows/release.yml
      - .release-please-manifest.json
      - .mise/tasks/test/release
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  MISE_EXEC_AUTO_INSTALL: 'false'
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

jobs:
  snapshot:
    name: Snapshot build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.6
          install_args: 'go jq goreleaser ko'
          cache: true
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Validate configuration
        run: mise exec -- goreleaser check

      - name: Snapshot release (no publish)
        # Bound concurrent builds to fit standard hosted runners.
        run: mise exec -- goreleaser release --snapshot --clean --parallelism=2

      - name: Smoke test packaged binary
        run: mise run test:release
