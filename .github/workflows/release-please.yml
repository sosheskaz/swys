name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  release-please:
    name: Release PR / tag
    runs-on: sosheskaz
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Job-level so serialization covers only the release-please action, not
    # the nested (long) release job; never cancel a run that may be tagging.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # GITHUB_TOKEN flows to called workflows automatically; no secrets:inherit.
  release:
    name: Release
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
