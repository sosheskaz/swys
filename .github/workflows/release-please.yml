name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  release-please:
    name: Release PR / tag
    if: >-
      github.ref == 'refs/heads/main' && toJSON(github.event.repository.private) == 'false' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Job-level so serialization covers only the release-please action, not
    # the nested (long) release job; never cancel a run that may be tagging.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      releases_created: ${{ steps.publish.outputs.releases_created }}
      tag_name: ${{ steps.publish.outputs.tag_name }}
    steps:
      - name: Checkout release configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.6
          install_args: 'node gh npm:release-please'
          cache: false

      - name: Publish merged release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLEASE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          before=$(mktemp)
          after=$(mktemp)
          trap 'rm -f "$before" "$after"' EXIT

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[].tag_name' | sort -u > "$before"
          release-please github-release \
            --repo-url="${GITHUB_REPOSITORY}" \
            --target-branch=main \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json \
            --token="${RELEASE_PLEASE_TOKEN}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[].tag_name' | sort -u > "$after"

          tag_name=$(comm -13 "$before" "$after" | head -n 1)
          if [[ -n "$tag_name" ]]; then
            echo "releases_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          else
            echo "releases_created=false" >> "$GITHUB_OUTPUT"
            echo "tag_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update release pull request
        env:
          RELEASE_PLEASE_TOKEN: ${{ github.token }}
        run: |
          release-please release-pr \
            --repo-url="${GITHUB_REPOSITORY}" \
            --target-branch=main \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json \
            --token="${RELEASE_PLEASE_TOKEN}"

  # GITHUB_TOKEN flows to called workflows automatically; no secrets:inherit.
  release:
    name: Release
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    # Keep ./ until actionlint supports $/; then migrate and remove this exception.
    # https://github.com/rhysd/actionlint/issues/711
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
    permissions:
      contents: write
      packages: write
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      BREW_PAT: ${{ secrets.BREW_PAT }}
