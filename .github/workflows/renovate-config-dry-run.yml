name: Renovate config dry run

on:
  pull_request:
    paths:
      - .github/renovate.json
      - .config/mise/config.toml
      - '**/go.mod'
      - '**/go.sum'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - .github/workflows/*
      - .github/renovate.Dockerfile
      - .github/scripts/renovate-evidence.cjs
      - .config/mise/tasks/lint/renovate
  push:
    branches: [main]
    paths:
      - .github/renovate.json
      - .config/mise/config.toml
      - '**/go.mod'
      - '**/go.sum'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - .github/workflows/*
      - .github/renovate.Dockerfile
      - .github/scripts/renovate-evidence.cjs
      - .config/mise/tasks/lint/renovate
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate config and dependency lookup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.6
          install_args: node
          cache: true
          cache_save: false

      - name: Record checked revision
        run: git rev-parse HEAD

      - name: Validate and look up dependencies
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: mise run lint:renovate --lookup
