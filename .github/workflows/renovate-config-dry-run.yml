name: Renovate config dry run

on:
  pull_request:
    paths:
      - renovate.json
      - mise.toml
      - .github/workflows/renovate.yml
      - .github/workflows/renovate-config-dry-run.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    uses: sosheskaz-systems/reno/.github/workflows/renovate-config-dry-run.yml@30ccd481020f0cefc05ea910c5fd20e82baab83b # v1.1.3
    with:
      install-go: true
      log-level: ${{ vars.RENOVATE_LOG_LEVEL || 'info' }}
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
