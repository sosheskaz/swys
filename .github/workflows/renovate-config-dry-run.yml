name: Renovate config dry run

on:
  pull_request:
    paths:
      - renovate.json
      - mise.toml
      - .github/workflows/renovate.yml
      - .github/workflows/renovate-config-dry-run.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    uses: sosheskaz-systems/reno/.github/workflows/renovate-config-dry-run.yml@d2fa3e8bdb084a57d0c79b77f7d269dd226204e1 # v1.2.1
    with:
      install-go: true
      log-level: ${{ vars.RENOVATE_LOG_LEVEL || 'info' }}
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
