name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REF: ${{ inputs.release_tag || github.ref }}

jobs:
  goreleaser:
    name: GoReleaser + ko
    runs-on: sosheskaz-buildkit
    timeout-minutes: 120
    # Serialize releases: concurrent runs would race on the ghcr.io
    # latest/major tags, letting an older release finish last and win.
    # A queued release displaced from the pending slot can be replayed via
    # workflow_dispatch with its release_tag.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.REF }}
          fetch-depth: 0
          fetch-tags: true

      # cache: false — published artifacts must never be built from state a
      # PR-writable cache could have poisoned; releases pay for pristine
      # toolchains.
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: 'go goreleaser ko uv'
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --parallelism caps concurrent builds. It defaults to GOMAXPROCS, which on
        # a runner pod with no CPU limit is the host core count, not the pod's share.
        run: mise exec -- goreleaser release --clean --parallelism=2
